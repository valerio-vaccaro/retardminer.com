[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson @ ^7.0.4
  links2004/WebSockets @ ^2.7.0
build_flags =
  -D CORE_DEBUG_LEVEL=0
  -D WEBSOCKETS_SERVER_CLIENT_MAX=12
test_build_src = true
